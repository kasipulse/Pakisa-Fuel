<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pakisa Fuel - Management</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1b365d">
  <style>
    :root {
      --win98-gray: #c0c0c0;
      --win98-dark-gray: #808080;
      --win98-light-gray: #dfdfdf;
      --win98-blue: #000080;
      --win98-blue-highlight: #1084d0;
      --pakisa-blue: #1b365d;
      --pakisa-gold: #c5a059;
      --pakisa-white: #ffffff;
    }

    body {
      background-color: var(--win98-gray);
      font-family: "MS Sans Serif", Arial, Tahoma, sans-serif;
      font-size: 14px;
      margin: 0;
      padding: 10px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .window {
      background-color: var(--win98-gray);
      width: 100%;
      max-width: 480px;
      border-top: 2px solid var(--win98-white);
      border-left: 2px solid var(--win98-white);
      border-right: 2px solid var(--win98-dark-gray);
      border-bottom: 2px solid var(--win98-dark-gray);
      box-shadow: 4px 4px 10px rgba(0,0,0,0.5);
      margin-top: 10px;
    }

    .title-bar {
      background: linear-gradient(90deg, var(--win98-blue), var(--win98-blue-highlight));
      color: white;
      padding: 6px 8px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .title-bar-controls button {
      background-color: var(--win98-gray);
      border-top: 1px solid var(--win98-white);
      border-left: 1px solid var(--win98-white);
      border-right: 1px solid var(--win98-dark-gray);
      border-bottom: 1px solid var(--win98-dark-gray);
      width: 18px;
      height: 18px;
      font-size: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    .window-body {
      padding: 12px;
    }

    fieldset {
      border: 2px groove var(--win98-light-gray);
      background-color: var(--win98-gray);
      margin-bottom: 12px;
      padding: 10px;
    }

    legend {
      font-weight: bold;
      color: var(--win98-blue);
    }

    .form-row {
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
    }

    label {
      margin-bottom: 4px;
      font-weight: bold;
      font-size: 13px;
    }

    select, input {
      background-color: var(--pakisa-white);
      border-top: 2px solid var(--win98-dark-gray);
      border-left: 2px solid var(--win98-dark-gray);
      border-right: 2px solid var(--win98-white);
      border-bottom: 2px solid var(--win98-white);
      padding: 8px;
      font-family: inherit;
      font-size: 14px;
      width: 100%;
      box-sizing: border-box;
    }

    button.win98-btn {
      background-color: var(--win98-gray);
      border-top: 2px solid var(--win98-white);
      border-left: 2px solid var(--win98-white);
      border-right: 2px solid var(--win98-dark-gray);
      border-bottom: 2px solid var(--win98-dark-gray);
      padding: 10px 14px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      margin-top: 5px;
      font-size: 14px;
    }

    button.win98-btn:active {
      border-top: 2px solid var(--win98-dark-gray);
      border-left: 2px solid var(--win98-dark-gray);
      border-right: 2px solid var(--win98-white);
      border-bottom: 2px solid var(--win98-white);
    }

    .output-box {
      background: black;
      color: #00ff00;
      font-family: "Courier New", monospace;
      padding: 10px;
      border: 2px inset var(--win98-dark-gray);
      margin-top: 10px;
      min-height: 50px;
      font-size: 13px;
      word-break: break-all;
    }

    .badge-pending { color: yellow; font-weight: bold; }
    .badge-approved { color: #00ff00; font-weight: bold; }
  </style>
</head>
<body>

<div class="window">
  <div class="title-bar">
    <span>Pakisa Fuel - Management v1.0</span>
    <div class="title-bar-controls"><button>_</button><button>X</button></div>
  </div>
  <div class="window-body">
    
    <!-- Voucher Generator Section -->
    <fieldset>
      <legend>Issue New Fuel Voucher</legend>
      <div class="form-row">
        <label>Select Driver:</label>
        <select id="driver"></select>
      </div>
      <div class="form-row">
        <label>Select Vehicle Registration:</label>
        <select id="vehicle"></select>
      </div>
      <div class="form-row">
        <label>Amount Approved (R):</label>
        <input type="number" id="amount" placeholder="e.g. 500">
      </div>
      <button class="win98-btn" onclick="createVoucher()">Generate Secure PIN</button>
    </fieldset>

    <!-- Quick Add Register Section -->
    <fieldset>
      <legend>Register New Driver / Vehicle</legend>
      <div class="form-row">
        <label>New Driver Name:</label>
        <input type="text" id="newDriverName" placeholder="e.g. John Doe">
      </div>
      <div class="form-row">
        <label>Driver Phone (WhatsApp):</label>
        <input type="text" id="newDriverPhone" placeholder="e.g. 27821234567">
      </div>
      <button class="win98-btn" style="background-color:#e0e0e0;" onclick="addNewDriver()">+ Add Driver to Database</button>

      <div class="form-row" style="margin-top: 15px;">
        <label>New Vehicle Registration:</label>
        <input type="text" id="newVehicleReg" placeholder="e.g. MK51ZRGP" style="text-transform: uppercase;">
      </div>
      <button class="win98-btn" style="background-color:#e0e0e0;" onclick="addNewVehicle()">+ Add Vehicle to Database</button>
    </fieldset>

    <!-- System Output Section -->
    <fieldset>
      <legend>System Output / Action</legend>
      <div id="code-output" class="output-box">Ready for transaction entry...</div>
    </fieldset>

  </div>
</div>

<script type="module">
  import { db, generateCode } from "./app.js";
  import { collection, addDoc, getDocs, Timestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  // Load Dropdown Options
  async function loadInitialData() {
    const driversSelect = document.getElementById("driver");
    const vehiclesSelect = document.getElementById("vehicle");

    driversSelect.innerHTML = '<option value="">-- Select Driver --</option>';
    vehiclesSelect.innerHTML = '<option value="">-- Select Vehicle --</option>';

    try {
      const driversSnap = await getDocs(collection(db, "drivers"));
      driversSnap.forEach(d => {
        driversSelect.innerHTML += `<option value="${d.id}">${d.data().name}</option>`;
      });

      const vehiclesSnap = await getDocs(collection(db, "vehicles"));
      vehiclesSnap.forEach(v => {
        vehiclesSelect.innerHTML += `<option value="${v.id}">${v.data().registration}</option>`;
      });
    } catch (e) {
      console.error("Error loading dropdowns:", e);
    }
  }

  // Generate Voucher Logic
  window.createVoucher = async function() {
    const driverId = document.getElementById("driver").value;
    const vehicleId = document.getElementById("vehicle").value;
    const amount = Number(document.getElementById("amount").value);

    if(!driverId || !vehicleId || !amount) {
      alert("Please fill in all voucher fields!");
      return;
    }

    const now = new Date();
    const hour = now.getHours();
    const dayOfWeek = now.getDay();

    let status = "APPROVED";
    let flags = [];

    if (amount > 600) {
      status = "PENDING";
      flags.push("Amount > R600");
    }
    if (hour >= 18 || hour < 6) {
      status = "PENDING";
      flags.push("After Hours (Post 18:00)");
    }
    if (dayOfWeek === 0 || dayOfWeek === 6) {
      status = "PENDING";
      flags.push("Weekend Transaction");
    }

    const code = generateCode();

    await addDoc(collection(db, "fuel_vouchers"), {
      code,
      driverId,
      vehicleId,
      amountApproved: amount,
      status,
      flags,
      createdAt: Timestamp.now()
    });

    const outputBox = document.getElementById("code-output");
    const managerPhone = "27658177124"; // Mpho Mahlaba

    if(status === "APPROVED") {
      outputBox.innerHTML = `SUCCESS!<br>PIN: <b>${code}</b><br>Status: <span class="badge-approved">APPROVED</span>`;
    } else {
      const waMessage = encodeURIComponent(`🔔 *PAKISA APPROVAL REQUIRED*\nCode: ${code}\nAmt: R${amount}\nReason: ${flags.join(", ")}`);
      outputBox.innerHTML = `FLAGGED!<br>PIN: <b>${code}</b><br>Status: <span class="badge-pending">PENDING</span><br>Reasons: ${flags.join(", ")}<br><br>
      <a href="https://wa.me/${managerPhone}?text=${waMessage}" target="_blank" style="color: #ffff00; text-decoration: underline; font-weight: bold;">📲 Send WhatsApp to Mpho Mahlaba</a>`;
    }
  }

  // Quick Add Driver Function
  window.addNewDriver = async function() {
    const name = document.getElementById("newDriverName").value.trim();
    const phone = document.getElementById("newDriverPhone").value.trim();

    if(!name || !phone) {
      alert("Please enter both driver name and phone number.");
      return;
    }

    try {
      await addDoc(collection(db, "drivers"), { name, phone });
      alert(`Driver "${name}" successfully added!`);
      document.getElementById("newDriverName").value = "";
      document.getElementById("newDriverPhone").value = "";
      loadInitialData(); // Refresh dropdowns immediately
    } catch (err) {
      console.error(err);
      alert("Failed to add driver.");
    }
  }

  // Quick Add Vehicle Function
  window.addNewVehicle = async function() {
    const registration = document.getElementById("newVehicleReg").value.trim().toUpperCase();

    if(!registration) {
      alert("Please enter a vehicle registration number.");
      return;
    }

    try {
      await addDoc(collection(db, "vehicles"), { registration });
      alert(`Vehicle "${registration}" successfully added!`);
      document.getElementById("newVehicleReg").value = "";
      loadInitialData(); // Refresh dropdowns immediately
    } catch (err) {
      console.error(err);
      alert("Failed to add vehicle.");
    }
  }

    loadInitialData();
</script>

</body>
</html>
